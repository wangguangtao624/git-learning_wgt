<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git 互动课堂</title><style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#17283a;background:#eff4f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;font-weight:650;background:#2368e8;color:white}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible{outline:3px solid #f4a340;outline-offset:2px}.shell{max-width:1300px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.brand{font-size:1.2rem;font-weight:800}.brand span{color:#2368e8}.tag{color:#526b7e;font-size:.9rem}.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.sidebar,.panel{background:white;border:1px solid #dce6ed;border-radius:16px;box-shadow:0 8px 25px #2b49620b}.sidebar{padding:18px;height:fit-content}.sidebar h2{font-size:.9rem;color:#6d8190;margin:0 0 12px}.lesson{display:flex;width:100%;text-align:left;background:transparent;color:#405b6e;margin:5px 0;padding:12px;gap:10px;font-weight:500}.lesson.active{background:#eaf2ff;color:#1457c3;font-weight:750}.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e3edf4;font-size:.8rem;flex:none}.active .num{background:#2368e8;color:white}.content{display:grid;gap:18px}.hero{padding:26px 30px;background:#173d69;color:white;border-radius:16px;position:relative;overflow:hidden}.hero:after{content:'↗';position:absolute;right:30px;top:-40px;font-size:180px;color:#ffffff0c}.eyebrow{font-size:.85rem;color:#a8d4ff;font-weight:700}.hero h1{font-size:1.8rem;margin:9px 0}.hero p{color:#dcebf6;margin:0;line-height:1.7}.bodygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,.85fr);gap:18px}.panel{padding:24px}.panel h2{margin:0 0 7px;font-size:1.15rem}.muted{color:#657c8e;line-height:1.7;margin:0}.diagram{display:flex;align-items:stretch;gap:8px;margin:22px 0;flex-wrap:wrap}.node{flex:1;min-width:110px;border:1px solid #cbdced;background:#f4f9ff;border-radius:11px;padding:13px;text-align:center;font-size:.92rem;font-weight:700}.node small{display:block;font-weight:400;color:#668095;margin-top:5px}.arrow{align-self:center;color:#6b8ca4}.callout{background:#fff7e8;border-left:4px solid #eda439;border-radius:7px;padding:13px 15px;line-height:1.7;color:#664c20}.terminal{background:#142638;color:#dcebf3;border-radius:12px;overflow:hidden;margin-top:16px}.bar{background:#20394d;padding:10px 14px;color:#b2cad8;font-size:.85rem}.screen{padding:16px;min-height:185px;max-height:330px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font: .9rem/1.7 Consolas,monospace}.screen .cmd{color:#89d2ff}.screen .ok{color:#81dfb0}.screen .err{color:#ffa2a2}.inputrow{display:flex;align-items:center;border-top:1px solid #345064;padding:10px 14px;gap:8px}.inputrow span{color:#79d4ac}.inputrow input{min-width:0;flex:1;background:transparent;color:white;border:0;outline:0;font-family:Consolas,monospace}.inputrow button{padding:7px 12px;font-size:.85rem}.feedback{margin-top:15px;border-radius:10px;padding:14px;background:#edf5ff;line-height:1.7;color:#284d71}.feedback strong{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{background:#edf3f7;color:#30536c}.question{display:flex;gap:8px;margin-top:14px}.question input{min-width:0;flex:1;border:1px solid #ccdae4;border-radius:9px;padding:11px}.answer{margin-top:12px;color:#405b6e;line-height:1.7}.answer:empty{display:none}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{font-size:.85rem;background:#edf4fb;color:#2f5b80;padding:8px 10px}.footer{font-size:.85rem;color:#6e8493;text-align:center;margin:25px 0 5px}@media(max-width:850px){.grid,.bodygrid{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:4px}.sidebar h2{display:none}.lesson{min-width:155px}.shell{padding:15px}header{align-items:flex-start}.tag{display:none}.hero{padding:23px}.hero h1{font-size:1.45rem}}
</style></head><body><div class="shell"><header><div class="brand">◈ <span>Git</span> 互动课堂</div><div class="tag">你的学习路径 · 一次掌握一小步</div></header><div class="grid"><nav class="sidebar" aria-label="课程目录"><h2>课程进度</h2><div id="lessons"></div></nav><main class="content"><section class="hero"><div class="eyebrow" id="step"></div><h1 id="title"></h1><p id="subtitle"></p></section><div class="bodygrid"><section class="panel"><h2>先理解，再动手</h2><p class="muted" id="intro"></p><div class="diagram" id="diagram"></div><div class="callout" id="note"></div><div class="actions"><button class="secondary" id="prev">上一课</button><button id="next">下一课</button></div></section><section class="panel"><h2>练习终端 <span style="font-size:.8rem;color:#668095;font-weight:400">· 模拟环境</span></h2><p class="muted">试着输入当前课程的指令，老师会检查拼写和含义。</p><div class="terminal"><div class="bar">● ● ●　练习窗口</div><div class="screen" id="screen" aria-live="polite">这里是模拟终端，不会修改你的电脑或 GitHub。\n</div><form class="inputrow" id="commandForm"><span>❯</span><input id="command" aria-label="输入 Git 指令" autocomplete="off" spellcheck="false" placeholder="在这里输入指令"><button>运行</button></form></div><div class="feedback" id="feedback"><strong>练习目标</strong><span id="goal"></span></div><div class="actions"><button class="secondary" id="hint">给我提示</button><button class="secondary" id="clear">清空终端</button></div></section></div><section class="panel"><h2>有问题？先问老师</h2><p class="muted">选择常见问题，或输入自己的问题。网页内的回答来自预设内容；复杂问题可以复制后发给对话中的老师。</p><div class="chips"><button class="chip" data-q="fetch是什么意思">fetch 是什么意思？</button><button class="chip" data-q="为什么会有提交">为什么会有提交？</button><button class="chip" data-q="为什么切换失败">为什么切换失败？</button><button class="chip" data-q="origin是什么">origin 是什么？</button></div><form class="question" id="questionForm"><input id="question" aria-label="输入问题" placeholder="例如：为什么显示红色？"><button>提问</button></form><div class="answer" id="answer" aria-live="polite"></div><div class="actions"><button class="secondary" id="copy">复制问题和学习进度</button></div></section></main></div><div class="footer">练习进度保存在当前浏览器 · 模拟输出用于教学，不代表真实仓库状态</div></div><script>
const data=[
{title:'Git 和 GitHub',sub:'先认识两位主角，再开始操作。',intro:'Git 帮你记录文件的版本；GitHub 是存放仓库并协作的网站。',nodes:[['你的电脑','修改文件'],['Git','记录版本'],['GitHub','远程仓库']],note:'重点：本地保存文件、Git 提交、上传 GitHub，是三个不同的动作。',goal:'输入 git --version，查看 Git 的版本。',command:'git --version',result:'git version 2.56.0.windows.4',explain:'这条命令只查看版本。模拟结果参考了你电脑上安装的 Git 版本。'},
{title:'查看仓库状态',sub:'像看仪表盘一样，先了解现在的情况。',intro:'git status 会告诉你当前分支、提交状态，以及有哪些文件发生变化。',nodes:[['工作文件','README 与笔记'],['git status','查看状态'],['终端输出','了解当前情况']],note:'红色的 untracked 表示文件还没被本地 Git 跟踪，并不代表文件坏了。',goal:'输入 git status，查看模拟仓库状态。',command:'git status',result:'On branch master\n\nNo commits yet\n\nUntracked files:\n  README.md\n  学习笔记/\n\nnothing added to commit but untracked files present',explain:'第一行是当前分支；第二块表示本地尚无提交；最后列出尚未跟踪的文件。'},
{title:'认识远程地址',sub:'给 GitHub 仓库保存一个容易记的名字。',intro:'remote 是远程仓库的地址信息，origin 是我们给这个地址起的简称。',nodes:[['本地仓库','你的电脑'],['origin','保存的地址简称'],['GitHub','你的远程仓库']],note:'记录地址不等于上传或下载；fetch 和 push 显示的是读取和上传使用的地址。',goal:'输入 git remote -v，查看远程地址。',command:'git remote -v',result:'origin  GitHub 仓库地址 (fetch)\norigin  GitHub 仓库地址 (push)',explain:'两行显示同一个远程仓库：一行用于获取，一行用于推送。'},
{title:'fetch：取回记录',sub:'先获取远程记录，不改变眼前的文件。',intro:'fetch 会从远程仓库获取提交和分支信息，并更新本地保存的远程跟踪分支。',nodes:[['GitHub','已有提交'],['fetch','取回记录'],['origin/main','本地保存的远程位置']],note:'fetch 不会新建提交，也不会自动把记录合并到当前分支，更不会自动覆盖工作文件。',goal:'输入 git fetch origin，模拟获取远程记录。',command:'git fetch origin',result:'remote: Enumerating objects: 7, done.\nremote: Counting objects: 100% (7/7), done.\nremote: Compressing objects: 100% (6/6), done.\nUnpacking objects: 100% (7/7), done.\n * [new branch] main -> origin/main',explain:'Git 已把远程记录取回，并将远程主分支的位置记录为 origin/main。'},
{title:'查看提交历史',sub:'看到已有的记录，不代表你刚刚创建了提交。',intro:'log 用于查看提交历史；--oneline 让每条记录显示在一行。',nodes:[['origin/main','远程记录'],['git log','翻看记录'],['提交列表','新记录在上']],note:'GitHub 已有的提交是之前创建的；fetch 和 log 都不会创建新的提交。',goal:'输入 git log --oneline origin/main。',command:'git log --oneline origin/main',result:'6775b63 (origin/main, origin/HEAD) 添加 Git 与 GitHub 入门学习笔记\n776d609 Initial commit',explain:'每行是一条提交：左边是简短编号，右边是提交说明。'},
{title:'理解切换失败',sub:'Git 发现同名文件可能被覆盖，于是保护性地停止。',intro:'你电脑中已经有 README 和学习笔记，它们尚未被当前本地仓库跟踪。远程版本也有同名文件。',nodes:[['本地未跟踪文件','已经存在'],['切换分支','可能覆盖'],['Git 停止','保护现有文件']],note:'真实状态：之前切换失败，文件没有被覆盖。先检查并保存现有文件，不要随意删除或强制切换。',goal:'输入 git status，练习查看目前的状态。',command:'git status',result:'On branch master\n\nNo commits yet\n\nUntracked files:\n  README.md\n  学习笔记/\n\nnothing added to commit but untracked files present',explain:'模拟结果对应截图中的状态。真实仓库请在真实终端运行 git status 检查。'}];
let current=Number(localStorage.getItem('git-class-step')||0);if(!Number.isInteger(current)||current<0||current>=data.length)current=0;const $=id=>document.getElementById(id);function render(){const d=data[current];$('lessons').innerHTML='';data.forEach((v,i)=>{let b=document.createElement('button');b.className='lesson'+(i===current?' active':'');b.innerHTML='<span class="num">'+(i+1)+'</span><span>'+v.title+'</span>';b.onclick=()=>{current=i;render()};$('lessons').appendChild(b)});$('step').textContent='课程 '+(current+1)+' / '+data.length;$('title').textContent=d.title;$('subtitle').textContent=d.sub;$('intro').textContent=d.intro;$('note').textContent=d.note;$('goal').textContent=d.goal;$('feedback').innerHTML='<strong>练习目标</strong><span></span>';$('feedback').lastElementChild.textContent=d.goal;$('diagram').innerHTML='';d.nodes.forEach((v,i)=>{if(i){let a=document.createElement('div');a.className='arrow';a.textContent='→';$('diagram').appendChild(a)}let n=document.createElement('div');n.className='node';n.textContent=v[0];let s=document.createElement('small');s.textContent=v[1];n.appendChild(s);$('diagram').appendChild(n)});$('prev').disabled=current===0;$('next').disabled=current===data.length-1;localStorage.setItem('git-class-step',current)}function append(text,cls){let p=document.createElement('div');p.className=cls;p.textContent=text;$('screen').appendChild(p);$('screen').scrollTop=$('screen').scrollHeight}function feedback(t){$('feedback').innerHTML='';let strong=document.createElement('strong');strong.textContent='老师反馈';$('feedback').appendChild(strong);$('feedback').appendChild(document.createTextNode(t))}$('commandForm').onsubmit=e=>{e.preventDefault();let value=$('command').value.trim().replace(/\s+/g,' ');if(!value)return;append('❯ '+value,'cmd');$('command').value='';let d=data[current];if(value===d.command){append(d.result,'ok');feedback('正确！'+d.explain)}else if(/oringin|orin\/main/.test(value)){append('模拟提示：没有找到这个远程名称。','err');feedback('检查拼写：远程简称是 origin，依次为 o-r-i-g-i-n。')}else if(value.includes('--online')){append('模拟提示：无法识别这个选项。','err');feedback('检查拼写：正确选项是 --oneline，最后还有一个 e。')}else{append('这条指令不在当前练习的预设答案中。','err');feedback('请对照练习目标；如需帮助，可以点击“给我提示”。')}};$('hint').onclick=()=>feedback('试试输入：'+data[current].command);$('clear').onclick=()=>{$('screen').textContent='这里是模拟终端，不会修改你的电脑或 GitHub。\n'};$('prev').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{if(current<data.length-1){current++;render()}};
function respond(q){q=q.toLowerCase();if(/fetch|获取|拉取/.test(q))return 'fetch 是取回远程已有的记录，并更新本地保存的远程位置。它不创建提交，也不自动修改当前工作文件。';if(/切换|覆盖|失败|报错|冲突/.test(q))return '切换被阻止是因为本地存在尚未跟踪的同名文件，Git 担心覆盖它们。先保留这些文件并检查差异，不要强制切换。';if(/提交|commit|记录/.test(q))return '提交是保存版本的一条记录。你看到的两条是 GitHub 原有的记录；fetch 只是取回，log 只是查看。';if(/origin|远程|地址/.test(q))return 'origin 是远程仓库地址的简称。origin/main 是本地保存的远程 main 分支位置。';if(/红色|未跟踪|untracked/.test(q))return '红色表示 Git 看到了这些文件，但当前本地仓库还没有开始跟踪它们；文件没有因此损坏。';if(/分支|branch|main|master/.test(q))return '分支可以先理解为版本记录上的一个可移动标签。main 和 master 是分支名；远程位置叫 origin/main。';return ''}function answerQuestion(q){$('question').value=q;let a=respond(q);$('answer').textContent=a||'这个问题还没有预设答案。点击下方“复制问题和学习进度”，然后粘贴到我们的对话中，我会结合你的真实情况回答。'}$('questionForm').onsubmit=e=>{e.preventDefault();let q=$('question').value.trim();if(q)answerQuestion(q)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answerQuestion(b.dataset.q));$('copy').onclick=async()=>{let t='我正在学习《'+data[current].title+'》。我的问题：'+($('question').value.trim()||'请继续指导我。');try{await navigator.clipboard.writeText(t);$('answer').textContent='已复制。请回到我们的对话，粘贴并发送。'}catch(e){$('answer').textContent='请手动复制：'+t}};render();
</script></body></html>
